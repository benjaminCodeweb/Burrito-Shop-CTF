services:
  internal-api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./internal-api:/app
      - internal_api_modules:/app/node_modules
    command: sh -c "npm install && npm start"
    # Sin "ports": este servicio NO es alcanzable desde el host, solo desde
    # otros contenedores de la red "labnet" por el nombre "internal-api".
    expose:
      - "4000"
    networks:
      - labnet

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      JWT_SECRET: lab-dev-secret-change-me
      INTERNAL_API_URL: http://internal-api:4000
      # Cambiar a "true" para ver la version parcheada (nickname escapado).
      ESCAPE_NICKNAME: "false"
    depends_on:
      - internal-api
    networks:
      - labnet

  front:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./front:/app
      - front_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - labnet

networks:
  labnet: {}

volumes:
  backend_modules: {}
  front_modules: {}
  internal_api_modules: {}
